name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # `npm ci` rather than `npm install`: it installs exactly the lockfile and
      # fails if package.json and the lock have drifted, which is the whole point
      # of pinning versions in the first place.
      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # Content checks run before the build on purpose. A malformed document then
      # fails in seconds with a readable message, instead of several minutes later
      # inside a bundler stack trace.
      - name: Validate content
        run: npm run content:check

      - name: Check media references
        run: npm run media:check

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: http://localhost:3000

      # Links are checked against a running server, not against the files in
      # .next. Checking the files does not work: root-relative hrefs like /about
      # have no document root to resolve against, /_next/static lives in a
      # different directory than the HTML, and the emitted canonical URLs are
      # absolute. Serving the build sidesteps all three and checks the addresses
      # readers actually get.
      - name: Install lychee
        env:
          # Pinned for the same reason the npm dependencies are: a reference
          # repository should behave the same a year from now.
          LYCHEE_VERSION: lychee-v0.24.2
        run: |
          target=lychee-x86_64-unknown-linux-gnu
          curl -sSfL \
            "https://github.com/lycheeverse/lychee/releases/download/${LYCHEE_VERSION}/${target}.tar.gz" \
            | tar -xz --strip-components=1 "${target}/lychee"
          ./lychee --version

      # Server startup, URL collection and link checking are one step on purpose.
      # A background process does not reliably survive the end of the step that
      # started it — neither a bare `&` nor `setsid nohup` was enough — so the
      # server has to live and die inside the step that uses it. That is also why
      # lychee is a downloaded binary here rather than the official action, which
      # would necessarily be a separate step.
      #
      # The standalone bundle is served rather than `next start`, which refuses to
      # run with output: 'standalone'. Checking this artefact is the better
      # arrangement anyway: it is exactly what the Docker image serves, so a
      # problem present only in the deployed bundle cannot hide behind a dev
      # server. The two `cp` lines mirror the Dockerfile's runner stage.
      - name: Check links against the served build
        run: |
          set -o pipefail

          cp -r .next/static .next/standalone/.next/static
          cp -r public .next/standalone/public

          PORT=3000 HOSTNAME=127.0.0.1 node .next/standalone/server.js > server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT

          # `if`, not `curl ... && break`. Under `set -e` an AND-list whose first
          # command fails makes the whole statement non-zero and aborts the
          # script — so the wait loop would exit with curl's status on its first
          # iteration, before the server had a chance to bind. A failure inside an
          # `if` condition is explicitly exempt.
          for i in $(seq 1 60); do
            if curl -sf -o /dev/null http://localhost:3000/; then
              echo "server up after ${i}s"
              break
            fi
            if [ "$i" -eq 60 ]; then
              echo "server did not start within 60s" >&2
              cat server.log >&2
              exit 1
            fi
            sleep 1
          done

          # The page list comes from the sitemap, which is generated from the
          # content layer — so a new article is link-checked automatically, and a
          # page missing from the sitemap is a separate bug this also surfaces.
          curl -sf http://localhost:3000/sitemap.xml -o sitemap-snapshot.xml

          # `|| true` because grep exits non-zero when it matches nothing, and
          # with pipefail that would abort before the check below can print the
          # sitemap that was actually received.
          { grep -o '<loc>[^<]*</loc>' sitemap-snapshot.xml || true; } \
            | sed 's|</*loc>||g' > link-check-urls.txt

          if [ ! -s link-check-urls.txt ]; then
            echo "no <loc> entries found in the sitemap:" >&2
            cat sitemap-snapshot.xml >&2
            exit 1
          fi
          echo "проверяются страницы:"
          cat link-check-urls.txt

          # The pages are downloaded and handed to lychee as files, rather than
          # passing the URL list directly. lychee checks the links it finds in its
          # inputs and does not crawl what it fetches — so a list of URLs only
          # proves those pages respond, which is not what "link checking" means.
          # Verified the hard way: a deliberately broken link in an article passed
          # a run configured that way.
          #
          # --base-url resolves the root-relative hrefs in the downloaded HTML
          # back to the running server. Without it every /articles/... and
          # /_next/... is unresolvable in a local file.
          mkdir -p link-check-pages
          page=0
          while read -r url; do
            page=$((page + 1))
            curl -sf "$url" -o "link-check-pages/page-${page}.html"
          done < link-check-urls.txt

          # Two runs, because the two kinds of input resolve links differently and
          # one --base-url cannot be right for both. In the downloaded pages an
          # href like /articles/x is a server path; in README.md a link like
          # src/content/index.ts is a file in the repository, and resolving that
          # against the server turns every one of them into a 404.
          #
          # Fragments are deliberately not checked. A downloaded page has no
          # memory of the URL it came from, so an on-page anchor like #решение-1
          # would resolve against the home page instead of its own document, and
          # every heading anchor would report as broken. Those anchors are
          # generated mechanically by rehype-autolink-headings from the heading
          # they sit on, so there is nothing to catch — only noise, and a noisy
          # check is one people learn to ignore.
          echo "--- ссылки на отданных страницах"
          ./lychee --no-progress --max-retries 2 \
            --base-url http://localhost:3000 \
            link-check-pages/*.html

          echo "--- ссылки в документации репозитория"
          ./lychee --no-progress --max-retries 2 \
            README.md docs/architecture.md
