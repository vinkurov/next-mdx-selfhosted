  <text x="80" y="410" font-size="72" font-weight="600" fill="#6fa2ff" letter-spacing="-2">+ MDX content layer</text>

  <text x="80" y="480" font-size="26" fill="#99a1b0">Контент в git · валидация на сборке · без CMS</text>

  <g font-size="20" fill="#7c8492" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">
